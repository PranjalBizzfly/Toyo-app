      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
        <!-- drop shadow -->
        <filter id="ts" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.5" in="SourceAlpha"/>
          <feOffset dy="3"/>
          <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
          <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>

        <g filter="url(#ts)">
          <!-- card (rounded rect, white border) -->
          <rect x="30" y="45" width="140" height="150" rx="24" ry="24" fill="#ffffff"/>
          <rect x="36" y="51" width="128" height="138" rx="20" ry="20" fill="#F5C842"/>

          <!-- blue bottom half -->
          <path d="M36 120 h128 v49 a20 20 0 0 1 -20 20 h-88 a20 20 0 0 1 -20 -20 z" fill="#1E9CE5"/>

          <!-- yellow/blue divider highlight -->
          <rect x="36" y="118" width="128" height="2" fill="rgba(255,255,255,0.5)"/>

          <!-- white up arrows (yellow section) -->
          <g fill="#ffffff">
            <!-- arrow helper: triangle + stem -->
            <g transform="translate(60 68)">
              <polygon points="0,14 10,0 20,14"/>
              <rect x="6" y="14" width="8" height="28" rx="1"/>
            </g>
            <g transform="translate(90 62)">
              <polygon points="0,14 10,0 20,14"/>
              <rect x="6" y="14" width="8" height="34" rx="1"/>
            </g>
            <g transform="translate(120 68)">
              <polygon points="0,14 10,0 20,14"/>
              <rect x="6" y="14" width="8" height="28" rx="1"/>
            </g>
          </g>

          <!-- circuit traces (blue section) -->
          <g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round">
            <path d="M46 140 L70 140 L70 155 L90 155 L90 170"/>
            <path d="M110 140 L110 150 L130 150 L130 170"/>
            <path d="M150 135 L150 160"/>
            <path d="M60 175 L80 175"/>
            <path d="M120 180 L145 180"/>
          </g>
          <g fill="#ffffff">
            <circle cx="46"  cy="140" r="2.5"/>
            <circle cx="90"  cy="170" r="2.5"/>
            <circle cx="110" cy="140" r="2.5"/>
            <circle cx="130" cy="170" r="2.5"/>
            <circle cx="150" cy="135" r="2.5"/>
            <circle cx="150" cy="160" r="2.5"/>
            <circle cx="60"  cy="175" r="2"/>
            <circle cx="80"  cy="175" r="2"/>
            <circle cx="120" cy="180" r="2"/>
            <circle cx="145" cy="180" r="2"/>
          </g>

          <!-- sprout stem -->
          <path d="M100 45 C 100 38, 98 32, 96 28" stroke="#5FA32A" stroke-width="3" fill="none" stroke-linecap="round"/>

          <!-- left leaf -->
          <path d="M96 28 C 80 24, 72 10, 80 4 C 92 6, 98 20, 96 28 Z" fill="#7BC142"/>
          <!-- right leaf -->
          <path d="M100 38 C 120 34, 132 18, 124 10 C 110 10, 100 22, 100 38 Z" fill="#7BC142"/>

          <!-- pixel accent on right leaf -->
          <rect x="120" y="8" width="6" height="6" fill="#7BC142"/>
          <rect x="126" y="2" width="4" height="4" fill="#a8dd6f"/>
        </g>
      </svg>
